    // Lucide Icons Implementation

    const Quote = (p) => <IconBase {...p}><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></IconBase>;
    const Info = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconBase>;
    const History = (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></IconBase>;

    const pageData = {
      name: "Velocity Bus",

      description: "Velocity Bus hadir untuk memberikan pengalaman perjalanan darat premium antarkota dan antarprovinsi dengan armada terbaru dan pelayanan kru profesional.",
      profileImg: "./images/logo-velocity.png",
      heroImg: "./images/background-velocity.jpg",
      links: {
        instagram: "https://www.instagram.com/solusilokal.id",
        maps: "https://maps.google.com/?q=Jl.+Tjilik+Riwut+Km.+5,+Palangka+Raya,+Kalimantan+Tengah", 
        tiktok: "https://www.tiktok.com/@solusilokal.id" 
      },
      highlights: [
        { text: "Tepat Waktu", icon: "Clock" },
        { text: "Armada Baru", icon: "Bus" },
        { text: "Kru Profesional", icon: "ShieldCheck" }
      ],
      about: "Velocity Bus didirikan dengan visi untuk meredefinisi standar transportasi darat di Indonesia. Kami berkomitmen memberikan layanan unggul yang mengutamakan keselamatan penumpang, kenyamanan tempat duduk, dan ketepatan waktu keberangkatan. Armada kami melalui perawatan rutin yang ketat dan dilengkapi fasilitas hiburan modern.",
      history: [
        { year: "2015", event: "Berdiri pertama kali dengan 5 armada bus melayani rute Jakarta - Bandung." },
        { year: "2018", event: "Ekspansi rute ke Jawa Tengah & Jawa Timur dengan tambahan armada Executive." },
        { year: "2021", event: "Peluncuran armada Sleeper Bus pertama untuk rute jarak jauh." },
        { year: "2024", event: "Meraih penghargaan 'Operator Bus Antarkota Terbaik' dan membuka rute Sumatera." }
      ],
      catalog: [
        { 
          name: "Sleeper Class", 
          specs: "21 Seats, AC, TV Personal, Toilet, Snack & Makan, Selimut, Bantal",
          img: "./images/sleeper-class.webp"
        },
        { 
          name: "Super Executive", 
          specs: "28 Seats (2-1), AC, Leg Rest, Toilet, Snack & Makan, Selimut",
          img: "./images/super-executive.webp"
        },
        { 
          name: "VIP Class", 
          specs: "36 Seats (2-2), AC, Reclining Seat, Toilet, Snack",
          img: "./images/vip-class.webp"
        }
      ],
      pricing: [
        { route: "Jakarta - Surabaya", class: "Sleeper Class", price: "Rp 550.000" },
        { route: "Jakarta - Solo", class: "Super Executive", price: "Rp 350.000" },
        { route: "Jakarta - Semarang", class: "VIP Class", price: "Rp 250.000" },
        { route: "Bandung - Malang", class: "Super Executive", price: "Rp 400.000" }
      ],
      locations: [
        { name: "Pool Utama Jakarta", detail: "Terminal Lebak Bulus, Loket 12" },
        { name: "Agen Bandung", detail: "Terminal Cicaheum, Kios A5" },
        { name: "Agen Surabaya", detail: "Terminal Bungurasih, Loket Utama" }
      ],
      faqs: [
        { q: "Apakah tiket bisa di-refund atau di-reschedule?", a: "Reschedule dapat dilakukan maksimal H-1 sebelum keberangkatan dengan biaya admin. Untuk refund saat ini belum tersedia kecuali ada pembatalan dari pihak kami." },
        { q: "Berapa kapasitas bagasi maksimal per penumpang?", a: "Setiap penumpang mendapatkan kuota bagasi maksimal 20kg. Kelebihan berat akan dikenakan biaya tambahan per kilogram." },
        { q: "Apakah anak di bawah 5 tahun wajib membeli tiket?", a: "Anak usia di bawah 3 tahun yang dipangku tidak dikenakan biaya. Usia 3 tahun ke atas wajib membeli tiket kursi penuh." },
        { q: "Fasilitas makan disediakan berapa kali?", a: "Tergantung jarak rute. Rute jauh (>10 jam) mendapatkan 1x makan berat dan 1x snack. Rute pendek mendapatkan 1x snack." }
      ],
      testimonials: [
        { name: "Andi Pratama", rating: 5, text: "Sleeper bus-nya sangat nyaman! Perjalanan Jakarta-Surabaya tidak terasa lelah. Kru bus juga sangat ramah dan informatif." },
        { name: "Rina Wijaya", rating: 5, text: "Armadanya bersih, AC dingin, dan tepat waktu sesuai jadwal keberangkatan. Sangat direkomendasikan untuk perjalanan bisnis." },
        { name: "Keluarga Siregar", rating: 4, text: "Pengalaman pertama naik Super Executive Velocity. Anak-anak sangat senang dengan TV personalnya. Servis makanannya juga enak." }
      ]
    };

    function App() {
      const [lightbox, setLightbox] = useState({ isOpen: false, images: [], currentIndex: 0 });
      const [showStickyCTA, setShowStickyCTA] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);
      const [copied, setCopied] = useState(false);
      const [openFaq, setOpenFaq] = useState(null);

      useEffect(() => {
        const handleScroll = () => {
          if (window.scrollY > 500) {
            setShowStickyCTA(true);
          } else {
            setShowStickyCTA(false);
          }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const openLightbox = (images, index) => {
        setLightbox({ isOpen: true, images, currentIndex: index });
        document.body.style.overflow = 'hidden'; 
      };

      const closeLightbox = () => {
        setLightbox({ ...lightbox, isOpen: false });
        document.body.style.overflow = 'unset';
      };

      const nextImage = (e) => {
        e.stopPropagation();
        setLightbox(prev => ({
          ...prev,
          currentIndex: (prev.currentIndex + 1) % prev.images.length
        }));
      };

      const prevImage = (e) => {
        e.stopPropagation();
        setLightbox(prev => ({
          ...prev,
          currentIndex: (prev.currentIndex - 1 + prev.images.length) % prev.images.length
        }));
      };

      const scrollToForm = () => {
        const el = document.getElementById('booking-form');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      const toggleFaq = (index) => {
        setOpenFaq(openFaq === index ? null : index);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('name');
        const route = formData.get('route');
        const date = formData.get('date');
        const count = formData.get('count');
        const notes = formData.get('notes');
        
        const waUrl = `https://wa.me/${pageData.phone}?text=Halo%20Admin%20${pageData.name},%20saya%20${name}.%20Saya%20ingin%20memesan%20tiket%20bus:%0A%0ARute:%20${route}%0ATanggal:%20${date}%0AJumlah:%20${count}%20Tiket%0ACatatan:%20${notes}%0A%0AMohon%20info%20ketersediaan%20dan%20cara%20pembayaran.`;
        window.open(waUrl, '_blank');
      };

      const handleShare = async () => {
        const shareData = {
          title: pageData.name,
          text: pageData.title,
          url: window.location.href,
        };
        if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
          try { await navigator.share(shareData); } catch (err) { console.error('Error sharing:', err); }
        } else {
          setShowShareModal(true);
        }
      };

      const copyToClipboard = () => {
        const tempInput = document.createElement('input');
        tempInput.value = window.location.href;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const shareToWhatsApp = () => window.open(`https://wa.me/?text=${encodeURIComponent(pageData.title + ' ' + window.location.href)}`, '_blank');
      const shareToFacebook = () => window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}`, '_blank');
      const shareToTwitter = () => window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(pageData.name)}`, '_blank');

      return (
        <main className="w-full max-w-[480px] mx-auto relative shadow-2xl bg-[#F8FAFC] min-h-screen overflow-hidden pb-32">
          
          {/* HERO SECTION */}
          <section className="relative w-full min-h-[100dvh] flex flex-col justify-end pb-12 px-6 bg-[#0f3c6e]">
            <button
              onClick={handleShare}
              aria-label="Share this page"
              className="absolute top-6 right-6 z-20 p-3 bg-[#0f3c6e]/40 backdrop-blur-md rounded-full border border-white/20 text-white hover:bg-[#0f3c6e]/60 transition-all shadow-sm"
            >
              <Share size={20} />
            </button>

            <div className="absolute inset-0 z-0">
              <img 
                src={pageData.heroImg} 
                alt={pageData.name} 
                className="w-full h-full object-cover object-top opacity-45"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0f3c6e] via-[#0f3c6e]/85 to-[#0f3c6e]/40"></div>
            </div>

            <div className="relative z-10 flex flex-col items-center text-center mt-36">
              <div className="w-28 h-28 rounded-full p-2 bg-white mb-6 shadow-2xl border-2 border-[#f27f22] flex items-center justify-center overflow-hidden">
                <img 
                  src={pageData.profileImg} 
                  alt="Profile" 
                  className="w-full h-full rounded-full object-contain"
                />
              </div>

              <h1 className="text-4xl font-extrabold text-white mb-3 leading-tight tracking-tight drop-shadow-md">
                {pageData.name}
              </h1>
              <p className="text-[#f27f22] font-semibold text-sm leading-relaxed mb-6 max-w-[95%]">
                {pageData.title}
              </p>
              <p className="text-slate-200 font-light text-xs leading-relaxed mb-8 max-w-[95%]">
                {pageData.description}
              </p>

              <div className="flex flex-col gap-3 w-full max-w-sm mb-8">
                <div className="grid grid-cols-2 gap-3">
                  <a href={pageData.links.instagram} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all text-white shadow-sm text-xs font-semibold">
                    <Instagram size={16} /> Instagram
                  </a>
                  <a href={pageData.links.tiktok} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all text-white shadow-sm text-xs font-semibold">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg> TikTok
                  </a>
                </div>
                <a href={pageData.links.maps} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 py-3.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all text-white shadow-sm text-xs font-semibold">
                  <MapPin size={16} /> Cek Pool / Lokasi Kami
                </a>
              </div>

              <button 
                onClick={scrollToForm}
                className="group relative flex items-center justify-center gap-3 w-full max-w-sm py-4 bg-[#f27f22] text-white rounded-2xl font-bold text-[13px] uppercase tracking-wider hover:brightness-110 transition-all shadow-[0_10px_30px_rgba(242,127,34,0.4)]"

                Pesan Tiket Sekarang
                <ArrowDown size={18} className="group-hover:translate-y-1 transition-transform" />

            </div>
          </section>

          {/* HIGHLIGHTS BAR */}
          <section className="py-5 px-6 bg-[#1e5a9c] border-t border-slate-800 shadow-inner">
            <div className="flex justify-between items-center w-full max-w-md mx-auto">
              {pageData.highlights.map((item, idx) => (
                <div key={idx} className="flex flex-col items-center gap-1">
                  {item.icon === 'Clock' && <Clock size={20} className="text-[#f27f22]" />}
                  {item.icon === 'Bus' && <Bus size={20} className="text-[#4db3e6]" />}

          {/* TENTANG KAMI */}

            <div className="mb-4 flex items-center gap-2">
              <Info className="text-[#0f3c6e]" size={24} />
              <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Tentang Kami</h2>
            </div>
            <p className="text-slate-600 text-sm leading-relaxed text-justify mb-8">
              {pageData.about}
            </p>

            {/* HISTORY / SEJARAH */}
            <div className="mb-6 flex items-center gap-2">
              <History className="text-[#0f3c6e]" size={24} />
              <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Perjalanan Kami</h2>
            </div>
            <div className="relative pl-4 border-l-2 border-[#4db3e6] space-y-6">
              {pageData.history.map((hist, idx) => (
                <div key={idx} className="relative">
                  <div className="absolute -left-[21px] top-1 w-3 h-3 bg-[#f27f22] rounded-full ring-4 ring-white"></div>
                  <h3 className="text-base font-bold text-slate-900 mb-1">{hist.year}</h3>
                  <p className="text-slate-500 text-xs leading-relaxed">{hist.event}</p>
                </div>
              ))}
            </div>
          </section>

          {/* KATALOG ARMADA */}
          <section className="py-10 bg-slate-50 border-y border-slate-200">
            <div className="px-6 mb-6 flex flex-col gap-1">
              <div className="flex items-center gap-2">
                <Bus className="text-[#f27f22]" size={24} />
                <h2 className="text-2xl font-extrabold text-[#0f3c6e] tracking-tight">Katalog Armada</h2>
              </div>
              <p className="text-slate-500 text-xs">Pilihan armada terbaik untuk kenyamanan perjalanan Anda.</p>
            </div>
            
            <div className="flex overflow-x-auto snap-x snap-mandatory gap-5 px-6 pb-6 no-scrollbar">
              {pageData.catalog.map((item, idx) => (
                <div 
                  key={idx}
                  className="snap-center shrink-0 w-[260px] bg-white rounded-3xl overflow-hidden shadow-md border border-slate-200 flex flex-col"
                >
                  <div 
                    className="w-full h-[320px] relative cursor-pointer group overflow-hidden"
                    onClick={() => openLightbox(pageData.catalog.map(c => c.img), idx)}
                  >
                    <img 
                      src={item.img} 
                      alt={item.name} 
                      className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                      loading="lazy"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-[#0f3c6e]/80 via-transparent to-transparent"></div>
                    <div className="absolute bottom-4 left-4 right-4">
                      <span className="px-3 py-1 bg-[#f27f22] text-white text-[10px] font-bold uppercase rounded-full tracking-wider shadow-sm">
                        Populer
                      </span>
                    </div>
                  </div>
                  <div className="p-5 flex flex-col gap-2">
                    <h3 className="font-extrabold text-lg text-[#0f3c6e]">{item.name}</h3>
                    <p className="text-xs text-slate-500 leading-relaxed border-t border-slate-100 pt-2">
                      <span className="font-semibold text-slate-700">Fasilitas: </span>
                      {item.specs}
                    </p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* HARGA & RUTE */}
          <section className="py-10 px-6 bg-white">
            <div className="mb-6 flex flex-col gap-1">
              <div className="flex items-center gap-2">
                <Ticket className="text-[#0f3c6e]" size={24} />
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Rute & Harga</h2>
              </div>
              <p className="text-slate-500 text-xs">Harga tiket mulai dari yang terjangkau hingga kelas premium.</p>
            </div>

            <div className="grid gap-3">
              {pageData.pricing.map((route, idx) => (
                <div key={idx} className="flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-2xl hover:shadow-md transition-shadow">
                  <div className="flex flex-col gap-1">
                    <span className="text-[14px] font-bold text-slate-800">{route.route}</span>
                    <span className="text-[11px] font-semibold text-[#1e5a9c] bg-blue-50 w-fit px-2 py-0.5 rounded-md border border-blue-100">{route.class}</span>
                  </div>
                  <span className="text-[15px] font-extrabold text-[#f27f22]">{route.price}</span>
                </div>
              ))}
            </div>
          </section>

          {/* LOKASI POOL / AGEN */}
          <section className="py-8 px-6 bg-[#0f3c6e] text-white">
            <div className="mb-6 flex flex-col gap-1">
              <div className="flex items-center gap-2">
                <Map className="text-[#4db3e6]" size={24} />
                <h2 className="text-2xl font-extrabold tracking-tight">Lokasi Titik Kumpul</h2>
              </div>
            </div>
            <div className="space-y-4">
              {pageData.locations.map((loc, idx) => (
                <div key={idx} className="flex gap-4 items-start bg-[#1e5a9c] p-4 rounded-2xl border border-blue-400/30">
                  <div className="bg-[#0f3c6e] p-2 rounded-xl text-[#f27f22] shrink-0">
                    <Navigation size={20} />
                  </div>
                  <div className="flex flex-col">
                    <span className="text-[14px] font-bold">{loc.name}</span>
                    <span className="text-xs text-slate-300 mt-1">{loc.detail}</span>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* FAQ */}
          <section className="py-10 px-6 bg-white border-b border-slate-200">
            <div className="mb-6 flex flex-col gap-1">
              <div className="flex items-center gap-2">
                <HelpCircle className="text-[#f27f22]" size={24} />
                <h2 className="text-2xl font-extrabold text-[#0f3c6e] tracking-tight">Tanya Jawab (FAQ)</h2>
              </div>
            </div>
            <div className="flex flex-col gap-3">
              {pageData.faqs.map((faq, idx) => (
                <div key={idx} className="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50">
                  <button 
                    onClick={() => toggleFaq(idx)}
                    className="w-full flex items-center justify-between p-4 text-left font-bold text-slate-800 text-[13px]"
                  >
                    {faq.q}
                    <ChevronDown size={18} className={`text-[#0f3c6e] transition-transform ${openFaq === idx ? 'rotate-180' : ''}`} />
                  </button>
                  {openFaq === idx && (
                    <div className="px-4 pb-4 pt-1 text-slate-600 text-xs leading-relaxed border-t border-slate-100">
                      {faq.a}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </section>

          {/* TESTIMONI */}
          <section className="py-10 px-6 bg-slate-50">
            <div className="mb-6 flex flex-col gap-1">
              <div className="flex items-center gap-2">
                <Quote className="text-[#4db3e6]" size={24} />
                <h2 className="text-2xl font-extrabold text-slate-900 tracking-tight">Ulasan Penumpang</h2>
              </div>
            </div>
            <div className="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-4 no-scrollbar">
              {pageData.testimonials.map((testi, idx) => (
                <div key={idx} className="snap-center shrink-0 w-[280px] bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-col gap-3">
                  <div className="flex items-center gap-1">
                    {[...Array(testi.rating)].map((_, i) => (
                      <Star key={i} size={14} className="fill-[#f27f22] text-[#f27f22]" />
                    ))}
                  </div>
                  <p className="text-slate-600 text-sm leading-relaxed italic">"{testi.text}"</p>
                  <div className="mt-auto pt-4 border-t border-slate-100 flex items-center gap-3">
                    <div className="w-9 h-9 rounded-full bg-[#e6f3fa] flex items-center justify-center text-[#0f3c6e] font-bold text-sm">
                      <Users size={16} />
                    </div>
                    <span className="text-[13px] font-bold text-slate-800">{testi.name}</span>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* BOOKING FORM CTA */}
          <section id="booking-form" className="py-12 px-6 bg-[#0f3c6e] relative overflow-hidden">
            <div className="absolute top-0 right-0 w-64 h-64 bg-[#f27f22]/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-0 left-0 w-64 h-64 bg-[#4db3e6]/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div className="bg-white rounded-[2rem] p-8 shadow-2xl relative z-10 border border-[#f27f22]/20">
              <div className="mb-8 text-center">
                <div className="inline-flex items-center justify-center w-12 h-12 bg-[#e6f3fa] text-[#0f3c6e] rounded-2xl mb-4">
                  <Ticket size={24} />
                </div>
                <h2 className="text-2xl font-extrabold text-slate-900 mb-2">Pesan Tiket Bus</h2>
                <p className="text-slate-500 text-xs leading-relaxed">Isi formulir di bawah ini untuk memesan tiket. Tim reservasi kami akan membalas via WhatsApp.</p>
              </div>
              
              <form onSubmit={handleFormSubmit} className="flex flex-col gap-4">
                <div className="flex flex-col gap-1.5">
                  <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wide ml-1">Nama Lengkap</label>
                  <input type="text" name="name" required placeholder="Sesuai KTP" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#0f3c6e] focus:ring-1 focus:ring-[#0f3c6e] transition-all" />
                </div>

                <div className="flex flex-col gap-1.5">
                  <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wide ml-1">Rute Perjalanan</label>
                  <select name="route" required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#0f3c6e] focus:ring-1 focus:ring-[#0f3c6e] transition-all appearance-none">
                    <option value="">Pilih Rute Tujuan...</option>
                    {pageData.pricing.map((r, i) => (
                      <option key={i} value={`${r.route} (${r.class})`}>{r.route} - {r.class}</option>
                    ))}
                  </select>
                </div>

                <div className="flex gap-3">
                  <div className="flex flex-col gap-1.5 w-full">
                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wide ml-1">Tgl Berangkat</label>
                    <input type="date" name="date" required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#0f3c6e] focus:ring-1 focus:ring-[#0f3c6e] transition-all" />
                  </div>
                  <div className="flex flex-col gap-1.5 w-1/2 shrink-0">
                    <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wide ml-1">Jumlah</label>
                    <input type="number" min="1" name="count" required placeholder="Org" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#0f3c6e] focus:ring-1 focus:ring-[#0f3c6e] transition-all" />
                  </div>
                </div>

                <div className="flex flex-col gap-1.5">
                  <label className="text-[11px] font-bold text-slate-500 uppercase tracking-wide ml-1">Catatan Tambahan (Opsional)</label>
                  <textarea name="notes" rows="2" placeholder="Cth: Ingin kursi di depan..." className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#0f3c6e] focus:ring-1 focus:ring-[#0f3c6e] transition-all resize-none"></textarea>
                </div>

                <button type="submit" className="w-full mt-4 bg-[#25D366] text-white font-bold text-sm tracking-wide py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-[#20b858] transition-colors shadow-lg">
                  <MessageCircle size={20} />
                  Lanjut ke WhatsApp
                </button>
              </form>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="pt-8 pb-12 text-center flex flex-col items-center justify-center mx-6">
            <div className="w-full h-px bg-slate-200 mb-8"></div>
            
            <div className="w-16 h-16 bg-white rounded-2xl shadow-sm border border-[#0f3c6e]/20 flex items-center justify-center mb-4 p-1 overflow-hidden">
              <img src={pageData.profileImg} alt="Footer Logo" className="w-full h-full object-cover rounded-xl" />
            </div>
            
            <div className="text-slate-500 flex flex-col gap-1 items-center">
              <span className="font-extrabold text-[#0f3c6e] text-base tracking-tight">{pageData.name}</span>
              <span className="max-w-[280px] text-xs mt-1 leading-relaxed">{pageData.address}</span>
            </div>

            <p className="text-slate-400 text-[10px] mt-8 mb-2">
              © {new Date().getFullYear()} {pageData.name}. All rights reserved.
            </p>
            <a 
              href="https://www.solusilokal.id" 
              target="_blank" 
              rel="noopener noreferrer"
              className="text-slate-400 text-[10px] tracking-wide font-medium hover:text-[#0f3c6e] transition-colors"
            >
              powered by solusilokal.id
            </a>
          </footer>

          {/* STICKY CTA */}
          <div 
            className={`fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-[432px] z-40 transition-all duration-500 ease-out ${
              showStickyCTA ? 'translate-y-0 opacity-100' : 'translate-y-24 opacity-0 pointer-events-none'
            }`}
          >
            <button 
              onClick={scrollToForm}
              className="w-full flex items-center justify-between px-6 py-4 brand-gradient border border-[#4db3e6]/50 rounded-2xl text-white shadow-[0_10px_40px_rgba(15,60,110,0.4)] hover:brightness-110 active:scale-[0.98] transition-all"
            >
              <span className="font-bold text-sm tracking-wide">Pesan Tiket Bus Sekarang</span>
              <div className="bg-[#f27f22] text-white p-2 rounded-xl">
                <Bus size={18} className="fill-none stroke-current stroke-2" />
              </div>
            </button>
          </div>

          {/* LIGHTBOX MODAL */}
          {lightbox.isOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/95 backdrop-blur-xl" onClick={closeLightbox}>
              <button className="absolute top-6 right-6 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20" onClick={closeLightbox}>
                <X size={20} />
              </button>
              {lightbox.images.length > 1 && (
                <button className="absolute left-4 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20" onClick={prevImage}>
                  <ChevronLeft size={24} />
                </button>
              )}
              <div className="w-full max-w-4xl max-h-[100dvh] p-4 flex items-center justify-center" onClick={(e) => e.stopPropagation()}>
                <img src={lightbox.images[lightbox.currentIndex]} alt="Katalog" className="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl" />
              </div>
              {lightbox.images.length > 1 && (
                <button className="absolute right-4 p-3 bg-white/10 rounded-full text-white hover:bg-white/20 transition-all z-50 border border-white/20" onClick={nextImage}>
                  <ChevronRight size={24} />
                </button>
              )}
              {lightbox.images.length > 1 && (
                <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-white text-xs font-bold tracking-[0.2em] bg-white/10 px-4 py-2 rounded-full backdrop-blur-md border border-white/20">
                  {lightbox.currentIndex + 1} / {lightbox.images.length}
                </div>
              )}
            </div>
          )}

          {/* SHARE MODAL */}
          {showShareModal && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-slate-900/40 backdrop-blur-sm sm:items-center transition-opacity" onClick={() => setShowShareModal(false)}>
              <div className="w-full max-w-[480px] bg-white sm:rounded-3xl rounded-t-3xl p-6 relative overflow-hidden animate-in slide-in-from-bottom-full sm:slide-in-from-bottom-0 sm:zoom-in-95 duration-300" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-center items-center mb-6 relative">
                  <h3 className="text-slate-900 font-bold text-[15px]">Bagikan {pageData.name}</h3>
                  <button onClick={() => setShowShareModal(false)} className="absolute right-0 p-1 text-slate-500 hover:bg-slate-100 rounded-full transition-all">
                    <X size={20} />
                  </button>
                </div>
                
                <div className="flex overflow-x-auto gap-3 pb-2 no-scrollbar items-start px-1 mb-6 mt-4">
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button onClick={copyToClipboard} className="w-[60px] h-[60px] rounded-full bg-slate-100 flex items-center justify-center text-slate-700 hover:bg-slate-200 transition-all shadow-sm border border-slate-200">
                      {copied ? <Check size={26} className="text-green-600" /> : <Copy size={26} />}
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">{copied ? 'Tersalin' : 'Salin Tautan'}</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button onClick={shareToTwitter} className="w-[60px] h-[60px] rounded-full bg-slate-900 flex items-center justify-center text-white hover:bg-slate-800 transition-all shadow-sm">
                      <Twitter size={26} />
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">X</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button onClick={shareToFacebook} className="w-[60px] h-[60px] rounded-full bg-[#1877F2] flex items-center justify-center text-white hover:brightness-110 transition-all shadow-sm">
                      <Facebook size={26} className="fill-current" />
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">Facebook</span>
                  </div>
                  <div className="flex flex-col items-center gap-2 min-w-[76px]">
                    <button onClick={shareToWhatsApp} className="w-[60px] h-[60px] rounded-full bg-[#25D366] flex items-center justify-center text-white hover:brightness-110 transition-all shadow-sm">
                      <MessageCircle size={26} className="fill-current" />
                    </button>
                    <span className="text-[11px] font-semibold text-slate-600 text-center">WhatsApp</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
